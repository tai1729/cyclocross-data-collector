name: Update race collection schedule

on:
  schedule:
    - cron: "0 0 1 * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-race-collection-schedule
  cancel-in-progress: false

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci
      - run: npm run update-schedule

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add race_days.json .github/workflows/collect.yml
          git diff --staged --quiet || git commit -m "chore: update race collection schedule"
          git push
