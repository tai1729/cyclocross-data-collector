      timezone: "Asia/Tokyo" # 2027-03-21 JST
    # END GENERATED RACE SCHEDULE
  workflow_dispatch:
    inputs:
      season:
        description: "過去シーズンを再収集する場合のシーズン (例: 2025-26)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: collect-race-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Discover meets
        run: |
          if [ -n "${{ inputs.season }}" ]; then
            npm run discover -- --season "${{ inputs.season }}"
          else
            npm run discover
          fi

      - run: npm run collect

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ races.json known_meets.json meets.json
          git diff --staged --quiet || git commit -m "chore: update race data"
          git push
